# Powerline Rainbow Preset(布局源自官方 gruvbox-rainbow preset)
"$schema" = 'https://starship.rs/config-schema.json'

# 配色可选:gruvbox_dark | everforest_dark
# 新增配色:复制一份 [palettes.<名称>],填齐同名 key 即可
palette = 'gruvbox_dark'

format = """
[](color_orange)\
$os\
$username\
$hostname\
[](bg:color_yellow fg:color_orange)\
$directory\
[](fg:color_yellow bg:color_aqua)\
$git_branch\
$git_status\
[](fg:color_aqua bg:color_blue)\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:color_blue bg:color_bg3)\
$docker_context\
$conda\
$pixi\
$nix_shell\
$cmd_duration\
[](fg:color_bg3 bg:color_bg1)\
$time\
[ ](fg:color_bg1)\
$line_break$character"""

[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_fg_on_bright = '#fbf1c7'
color_blue_fg = '#83a598'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#458588'
color_aqua = '#689d6a'
color_green = '#98971a'
color_orange = '#d65d0e'
color_purple = '#b16286'
color_red = '#cc241d'
color_yellow = '#d79921'

[palettes.everforest_dark]
color_fg0 = '#d3c6aa'
color_fg_on_bright = '#2d353b'
color_blue_fg = '#7fbbb3'
color_bg1 = '#3d484d'
color_bg3 = '#545a60'
color_green = '#a7c080'
color_orange = '#e69875'
color_purple = '#d699b6'
color_red = '#e67e80'
color_yellow = '#dbbc7f'
color_aqua = '#83c092'
color_blue = '#7fbbb3'

[os]
disabled = false
format = "[$symbol]($style)"
style = "bg:color_orange fg:color_fg_on_bright"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Arch = "󰣇"
Artix = "󰣇"
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
SUSE = ""
Manjaro = "󱘊"
Alpine = ""
Amazon = ""
Android = "󰀲"
AOSC = ""
EndeavourOS = ""
CentOS = "󱄚"
Pop = ""
NixOS = "󱄅"
openSUSE = ""
AlmaLinux = ""
RockyLinux = ""
Void = ""
Kali = ""
FreeBSD = "󰣠"
OpenBSD = ""
Solus = ""
Zorin = ""
KDENeon = ""
Nobara = ""
Illumos = ""
Garuda = ""
Elementary = ""
CachyOS = ""
Ios = "󰀷"
Unknown = "󰋗"

[username]
show_always = true
style_user = "bg:color_orange fg:color_fg_on_bright"
style_root = "bg:color_orange fg:color_fg_on_bright"
format = '[ $user ]($style)'

[hostname]
# ssh_only 默认 true:仅 SSH 会话显示(🌐 是模块自带符号)
style = "bg:color_orange fg:color_fg_on_bright"
format = '[ $ssh_symbol$hostname ]($style)'

[directory]
style = "fg:color_fg_on_bright bg:color_yellow"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:color_aqua"
format = '[[ $symbol $branch ](fg:color_fg_on_bright bg:color_aqua)]($style)'

[git_status]
style = "bg:color_aqua"
# 强制定义每个状态的显示格式，包含 ${count}
staged = "󰐗 ${count} "
modified = "󰏫 ${count} "
untracked = "󰧧 ${count} "
renamed = "󰑕 ${count} "
deleted = "󰍶 ${count} "
conflicted = " ${count} "
ahead = "󰶣 ${count} "
behind = "󰶡 ${count} "
diverged = "󰹹 " # 分叉状态通常不需要数字

format = '[[($all_status$ahead_behind )](fg:color_fg_on_bright bg:color_aqua)]($style)'

[nodejs]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg_on_bright bg:color_blue)]($style)'

[bun]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg_on_bright bg:color_blue)]($style)'

[c]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg_on_bright bg:color_blue)]($style)'

[cpp]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg_on_bright bg:color_blue)]($style)'

[rust]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg_on_bright bg:color_blue)]($style)'

[golang]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg_on_bright bg:color_blue)]($style)'

[php]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg_on_bright bg:color_blue)]($style)'

[java]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg_on_bright bg:color_blue)]($style)'

[kotlin]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg_on_bright bg:color_blue)]($style)'

[haskell]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg_on_bright bg:color_blue)]($style)'

[python]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg_on_bright bg:color_blue)]($style)'

[docker_context]
symbol = ""
style = "bg:color_bg3"
format = '[[ $symbol( $context) ](fg:color_blue_fg bg:color_bg3)]($style)'

[conda]
style = "bg:color_bg3"
format = '[[ $symbol( $environment) ](fg:color_blue_fg bg:color_bg3)]($style)'

[pixi]
style = "bg:color_bg3"
format = '[[ $symbol( $version)( $environment) ](fg:color_fg0 bg:color_bg3)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_bg1"
format = '[[  $time ](fg:color_fg0 bg:color_bg1)]($style)'

[battery]
format = '[ $symbol$percentage ]($style)'

[[battery.display]]
threshold = 10
style = "bg:color_bg1 fg:color_red bold"

[[battery.display]]
threshold = 101
style = "bg:color_bg1 fg:color_fg0"

[cmd_duration]
min_time = 2000
style = "bg:color_bg3"
format = '[[ $duration ](fg:color_fg0 bg:color_bg3)]($style)'

[nix_shell]
symbol = " "
style = "bg:color_bg3"
impure_msg = '[impure shell](bold red)'
pure_msg = '[pure shell](bold green)'
unknown_msg = '[unknown shell](bold yellow)'
format = '[[ $symbol$state( \($name\)) ](fg:color_fg0 bg:color_bg3)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:color_green)'
error_symbol = '[❯](bold fg:color_red)'
vimcmd_symbol = '[❮](bold fg:color_green)'
vimcmd_replace_one_symbol = '[❮](bold fg:color_purple)'
vimcmd_replace_symbol = '[❮](bold fg:color_purple)'
vimcmd_visual_symbol = '[❮](bold fg:color_yellow)'
