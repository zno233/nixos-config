# ============================================================
# 补丁 / 特效配置（对照 niri 的 patch.kdl）
# ============================================================

# ============================================================
# 模糊
# ============================================================

[appearance.blur]
enabled = true
# 全局 optimized = true：共享一份「壁纸缓存模糊」，几乎不耗 GPU。
# 需要模糊「真实背景」的表面，在各自规则里用 blur_optimized = false 单独覆盖。
optimized = true
passes = 2
radius = 5
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.2

# 透明窗口背景模糊
[[window_rule]]
match.app_id = [ '^kitty$', '^com\.mitchellh\.ghostty$' ]
blur = true
blur_optimized = false

# ============================================================
# Noctalia 层规则（面板 / 通知 / Dock / OSD 模糊）
# ============================================================

[[layer_rule]]
match.namespace = '^noctalia-(bar-[^"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^"]*)$'
blur = true
blur_optimized = false
blur_ignore_alpha = 0.5
blur_popups = true

# ============================================================
# 效果预设（可选）
# 启用需要先 include 预设文件，再把名字写进 [effects]。
# 系统路径由 NixOS 模块链接：/run/current-system/sw/share/umbriel/effects
# ============================================================

# [effects]
# border = "pulse"
# border_unfocused = true
#
# 并在 config.toml 的 [include] files 里追加：
#   "/run/current-system/sw/share/umbriel/effects/border/pulse/effect.toml"
