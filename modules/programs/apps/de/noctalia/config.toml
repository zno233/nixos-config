[audio]
enable_overdrive = true
enable_sounds = true

[bar.default]
background_opacity = 0.87999998033046722
capsule = true
capsule_opacity = 0.40000000000000002
center = [ "group:g2" ]
concave_edge_corners = true
end = [
    "tray",
    "clipboard",
    "wallpaper",
    "network",
    "bluetooth",
    "input_volume",
    "volume",
    "brightness",
    "battery",
    "notifications",
    "clock",
    "session"
]
margin_edge = 0.0
margin_ends = 0.0
padding = 6
radius = 0
radius_bottom_left = 16
radius_bottom_right = 16
start = [ "launcher", "workspaces", "group:g1", "weather", "nix-monitor", "active_window", "status" ]

    [[bar.default.capsule_group]]
    fill = "surface_variant"
    id = "g1"
    members = [ "cpu", "temp", "ram" ]
    opacity = 0.40000000596046448
    padding = 6.0

    [[bar.default.capsule_group]]
    fill = "surface_variant"
    id = "g2"
    members = [ "media" ]
    opacity = 0.40000000596046448
    padding = 6.0

[dock]
active_monitor_only = true
auto_hide = true
enabled = true
icon_size = 44
reserve_space = false

[location]
auto_locate = false

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@eDP-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002",
    "lockscreen-widget-0000000000000007",
    "lockscreen-widget-0000000000000005",
    "lockscreen-widget-0000000000000008"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 720.0
    cy = 728.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.0
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "compact"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = false
        show_media = false
        show_session_buttons = false
        show_unlock_hint = false
        show_weather = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 240.0
    box_width = 368.0
    cx = 304.0
    cy = 608.0
    output = "eDP-1"
    rotation = 0.0
    type = "weather"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background_opacity = 0.0
