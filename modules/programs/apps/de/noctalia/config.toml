[widget.active_window]
capsule = true
capsule_opacity = 0.40000000000000002
max_length = 150.0

[widget.audio_visualizer]
bands = 20
capsule = true
capsule_opacity = 0.40000000000000002
width = 100.0

[widget.battery]
show_label = false

[widget.brightness]
show_label = false

[widget.clock]
format = "{:%H:%M %A, %m/%d}"

[widget.cpu]
capsule = true
capsule_opacity = 0.40000000000000002
show_label = false

[widget.input_volume]
show_label = false

[widget.launcher]
capsule = true
capsule_opacity = 0.40000000000000002
custom_image = "/home/zno/Pictures/nixos_logo_icon.svg"
scale = 1.1499999999999999

[widget.media]
capsule = true
capsule_opacity = 0.40000000000000002
hide_when_no_media = true
max_length = 150.0
title_scroll = "on_hover"

[widget.network]
show_label = false

[widget.network_rx]
capsule = true
capsule_opacity = 0.40000000000000002
show_label = false

[widget.network_tx]
capsule = true
capsule_opacity = 0.40000000000000002
show_label = false

[widget.ram]
capsule = true
capsule_opacity = 0.40000000000000002
show_label = false

[widget.session]
color = "#CE9680"
scale = 1.1499999999999999

[widget.sysmon]
capsule = true

[widget.temp]
capsule = true
capsule_opacity = 0.40000000000000002
show_label = false

[widget.tray]
drawer = true
drawer_columns = 5

[widget.volume]
show_label = false

[widget.wallpaper]
