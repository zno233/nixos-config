    cx = 720.0
    cy = 575.806640625
    output = "eDP-1"
    rotation = 0.0
    type = "sticker"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000007.settings]
        background_opacity = 0.0
        image_path = "/home/zno/Pictures/头像/2026-04-18_09-25-08.webp"
        opacity = 1.0

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000008]
    box_height = 0.0
    box_width = 0.0
    cx = 1171.0
    cy = 624.0
    output = "eDP-1"
    rotation = 0.0
    type = "media_player"

